name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile config.py retailers.py search.py resale.py server.py tests/*.py

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -project ShoppingTools.xcodeproj -scheme ShoppingCompass -configuration Debug -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
      - run: xcodebuild -project ShoppingTools.xcodeproj -scheme ResaleWatcher -configuration Debug -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
