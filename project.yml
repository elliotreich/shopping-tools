name: ShoppingTools
options:
  deploymentTarget:
    macOS: "14.0"
targets:
  ShoppingCompass:
    type: application
    platform: macOS
    sources:
      - path: Shared
      - path: ShoppingCompass
    resources:
      - path: ShoppingCompass/Assets.xcassets
    info:
      path: ShoppingCompass/Info.plist
      properties:
        NSAppTransportSecurity:
          NSExceptionDomains:
            100.121.190.104:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elliotreich.ShoppingCompass
        PRODUCT_NAME: Shopping Compass
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  Finder:
    type: application
    platform: macOS
    sources:
      - path: Shared
      - path: Finder
    resources:
      - path: Finder/Assets.xcassets
    info:
      path: Finder/Info.plist
      properties:
        NSAppTransportSecurity:
          NSExceptionDomains:
            100.121.190.104:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elliotreich.Finder
        PRODUCT_NAME: Finder
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
