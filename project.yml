name: ShoppingCompass
options:
  deploymentTarget:
    macOS: "14.0"
targets:
  ShoppingCompass:
    type: application
    platform: macOS
    sources:
      - path: Shared
      - path: ShoppingCompass
    resources:
      - path: ShoppingCompass/Assets.xcassets
    info:
      path: ShoppingCompass/Info.plist
      properties:
        NSAppTransportSecurity:
          NSExceptionDomains:
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.ShoppingCompass
        PRODUCT_NAME: Shopping Compass
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
